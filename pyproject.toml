[project]
name = "customer-support-for-refund"
version = "0.1.0"
description = "Customer Support Action Agent using LangGraph, Human-in-the-Loop (HITL), and JEV Guardian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "langchain>=0.3.0",
    "langchain-groq>=0.1.9",
    "langgraph>=0.2.0",
    "pydantic>=2.8.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
